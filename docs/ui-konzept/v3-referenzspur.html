<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch C: Reference lane</title>
<link rel="stylesheet" href="skizze.css">
<style>
  /* Variante C: Referenz als feste Spur über der Timeline (Bereich ziehen),
     Dock geteilt: links Reiter (Karte neben der Kette), rechts Analyse */
  :root { --right-w: 23rem; }
  @media (max-width: 1500px) { :root { --right-w: 19rem; } }
  #app { grid-template-columns: var(--side-w) minmax(0, 1fr); }
  #reflane { flex: none; display: flex; background: var(--panel); border-bottom: 2px solid color-mix(in oklab, var(--warn) 35%, var(--line)); min-width: 0; }
  #reflane > .ltlabel { width: var(--hdr-w); border-bottom: 0; }
  #dock { height: 40%; display: grid; grid-template-columns: minmax(0, 1fr) var(--right-w); }
  .dockleft { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #dock > [data-slot-analysis] { border-left: 1px solid var(--line); min-height: 0; min-width: 0; }
  .tabpane[data-tab=routing].on { overflow: hidden; }
</style>
</head>
<body>
<header id="topbar"></header>
<div id="app">
  <aside id="tree"></aside>
  <main id="work">
    <div id="reflane" data-slot-ref></div>
    <div id="timeline"></div>
    <div id="dock">
      <div class="dockleft">
        <div class="tabs">
          <button class="tab on" data-tabbtn="routing" data-ctl="tab.routing">Routing</button>
          <button class="tab" data-tabbtn="mixer" data-ctl="tab.mixer">Mixer</button>
          <button class="tab" data-tabbtn="notes" data-ctl="tab.notes">Notes</button>
          <button class="tab" data-tabbtn="recipes" data-ctl="tab.recipes">Recipes</button>
        </div>
        <div class="tabpane on" data-tab="routing"><div data-slot-routing style="height:100%"></div></div>
        <div class="tabpane" data-tab="mixer"><div data-slot-mixer style="height:100%"></div></div>
        <div class="tabpane" data-tab="notes"><div data-slot-notes style="height:100%"></div></div>
        <div class="tabpane" data-tab="recipes"><div data-slot-recipes></div></div>
      </div>
      <div data-slot-analysis></div>
    </div>
  </main>
</div>
<script src="skizze.js"></script>
<script>build({ note: 'Sketch C — reference lane', ref: 'lane', card: 'inline' });</script>
</body>
</html>
